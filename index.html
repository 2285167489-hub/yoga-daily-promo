<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾扬格精准正位瑜伽 · 每日宣传方案</title>
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #3a3335;
    --muted: #8c8279;
    --accent: #b8956a;
    --accent-light: #f3ede5;
    --tag-bg: #e8e0d5;
    --border: #e5ddd3;
    --shadow: 0 2px 16px rgba(60,50,40,0.06);
    --skeleton: #e8e0d5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    padding: 24px 16px 60px;
    min-height: 100vh;
  }
  .container { max-width: 680px; margin: 0 auto; }

  /* ===== Header ===== */
  .header {
    text-align: center;
    padding: 36px 20px 28px;
    background: linear-gradient(135deg, #f5efe6 0%, #ede3d5 100%);
    border-radius: 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .header .icon { font-size: 48px; margin-bottom: 8px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #5c4a3a; }
  .header .date { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .header .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    border-radius: 20px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  /* ===== Notice ===== */
  .notice {
    text-align: center;
    padding: 10px 16px;
    background: #fff8e8;
    border: 1px solid #f0d78c;
    border-radius: 10px;
    font-size: 13px;
    color: #8a6d3b;
    margin-bottom: 16px;
  }

  /* ===== Section ===== */
  .section {
    background: var(--card);
    border-radius: 16px;
    padding: 24px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #5c4a3a;
  }
  .section-title .emoji { font-size: 22px; }

  /* Copy blocks */
  .copy-block {
    background: var(--accent-light);
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 12px;
    border-left: 4px solid var(--accent);
  }
  .copy-block:last-child { margin-bottom: 0; }
  .copy-block .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .copy-block blockquote {
    border: none;
    padding: 0;
    margin: 0;
    font-size: 14.5px;
    line-height: 2;
    white-space: pre-line;
    color: #4a3f38;
  }

  /* Tip */
  .tip {
    background: #fffdf8;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .tip h4 { font-size: 15px; margin-bottom: 8px; color: #5c4a3a; }
  .tip ul { padding-left: 18px; }
  .tip li { font-size: 14px; margin-bottom: 4px; color: #5e5550; }
  .tip .summary { font-size: 13px; color: var(--accent); margin-top: 10px; }

  /* Guides */
  .guides { list-style: none; padding: 0; }
  .guides li {
    background: #fffdf8;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    color: #5e5550;
  }

  /* Tags */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .tag {
    display: inline-block;
    padding: 5px 12px;
    background: var(--tag-bg);
    border-radius: 16px;
    font-size: 13px;
    color: #6b5e52;
    letter-spacing: 0.3px;
  }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: var(--accent-light);
    font-weight: 600;
    color: #5c4a3a;
    font-size: 13px;
    white-space: nowrap;
  }
  td { color: #4a3f38; }
  tr:last-child td { border-bottom: none; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 24px 0;
    color: var(--muted);
    font-size: 12px;
  }

  /* ===== Skeleton Loading ===== */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--skeleton) 25%, #f0ebe0 50%, var(--skeleton) 75%);
    background-size: 800px 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 8px;
  }
  .sk-header { height: 140px; border-radius: 20px; margin-bottom: 24px; }
  .sk-section { height: 160px; border-radius: 16px; margin-bottom: 16px; }
  .sk-section:nth-child(3) { height: 200px; }
  .sk-section:nth-child(4) { height: 120px; }
  .sk-section:nth-child(5) { height: 180px; }

  /* ===== Error State ===== */
  .error-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .error-state .emoji { font-size: 56px; margin-bottom: 16px; }
  .error-state h2 { font-size: 18px; color: #5c4a3a; margin-bottom: 8px; }
  .error-state p { font-size: 14px; line-height: 1.8; }
  .error-state .brand-info {
    margin-top: 24px;
    padding: 20px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    text-align: left;
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .header h1 { font-size: 19px; }
    .section { padding: 18px 14px; }
    .copy-block blockquote { font-size: 13.5px; }
    th, td { padding: 8px 6px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Skeleton loading (hidden after data loads) -->
  <div id="skeleton">
    <div class="skeleton sk-header"></div>
    <div class="skeleton sk-section"></div>
    <div class="skeleton sk-section"></div>
    <div class="skeleton sk-section"></div>
    <div class="skeleton sk-section"></div>
  </div>

  <!-- Content container (hidden until data loads) -->
  <div id="content" style="display:none;"></div>

  <!-- Error state (hidden unless all loads fail) -->
  <div id="error" style="display:none;">
    <div class="error-state">
      <div class="emoji">🧘‍♀️</div>
      <h2>艾扬格精准正位瑜伽</h2>
      <p>精准，是最好的保护。正位，是最深的疗愈。</p>
      <div class="brand-info">
        <p style="font-size:14px;color:#5c4a3a;">
          艾扬格瑜伽（Iyengar Yoga）由 B.K.S. Iyengar 大师创立，以<strong>精准正位</strong>为核心，
          大量使用瑜伽砖、瑜伽带、抱枕等辅具，帮助练习者在安全的前提下达到正确的体式对齐。
          适合零基础、体态矫正、瑜伽理疗等各类人群。
        </p>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const skeleton = document.getElementById('skeleton');
  const content = document.getElementById('content');
  const error = document.getElementById('error');

  // Cache-busting: add timestamp to avoid browser cache
  const ts = new Date().toISOString().slice(0,10);
  const DATA_URL = `yoga_data.json?t=${ts}`;
  const FALLBACK_URL = 'yoga_default.json';

  function show(el) { el.style.display = ''; }
  function hide(el) { el.style.display = 'none'; }

  function renderPage(data) {
    hide(skeleton);
    hide(error);

    let html = '';

    // Header
    const dateDisplay = data.date === '默认' ? '品牌通用方案' : `📅 ${data.date} · 每日宣传方案`;
    html += `<div class="header">
      <div class="icon">🧘‍♀️</div>
      <h1>${esc(data.brand || '艾扬格精准正位瑜伽')}</h1>
      <div class="date">${dateDisplay}</div>
      <div class="badge">✨ 综合宣传方案</div>
    </div>`;

    // Notice (if using fallback)
    if (data.notice) {
      html += `<div class="notice">${esc(data.notice)}</div>`;
    }

    // Sections
    (data.sections || []).forEach(sec => {
      html += '<div class="section">';
      html += `<div class="section-title"><span class="emoji">${esc(sec.title.slice(0,2) || '📌')}</span>${esc(sec.title)}</div>`;

      switch (sec.type) {
        case 'copy_blocks':
          (sec.items || []).forEach(item => {
            html += `<div class="copy-block">
              <div class="label">${esc(item.label)}</div>
              <blockquote>${esc(item.content)}</blockquote>
            </div>`;
          });
          break;

        case 'tip':
          html += `<div class="tip">
            <h4>${esc(sec.heading || '')}</h4>
            <ul>${(sec.points || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
            ${sec.summary ? `<p class="summary">${esc(sec.summary)}</p>` : ''}
          </div>`;
          break;

        case 'tips_and_tags':
          if (sec.guides && sec.guides.length) {
            html += `<ul class="guides">${sec.guides.map(g => `<li>${esc(g)}</li>`).join('')}</ul>`;
          }
          if (sec.tags && sec.tags.length) {
            html += `<div class="tags">${sec.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
          }
          break;

        case 'table':
          html += '<div class="table-wrap"><table>';
          if (sec.headers && sec.headers.length) {
            html += `<thead><tr>${sec.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>`;
          }
          html += '<tbody>';
          (sec.rows || []).forEach(row => {
            html += '<tr>' + row.map(cell => `<td>${esc(cell)}</td>`).join('') + '</tr>';
          });
          html += '</tbody></table></div>';
          break;

        default:
          html += `<p style="color:var(--muted);font-size:14px;">暂不支持的类型: ${esc(sec.type)}</p>`;
      }

      html += '</div>';
    });

    // Footer
    html += `<div class="footer">
      <p>🧘‍♀️ ${esc(data.brand || '艾扬格精准正位瑜伽')} · 每日自动生成</p>
      <p style="margin-top:4px;">${esc(data.tagline || '精准，是最好的保护。正位，是最深的疗愈。')}</p>
    </div>`;

    content.innerHTML = html;
    show(content);
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Try primary data, then fallback
  fetch(DATA_URL)
    .then(res => {
      if (!res.ok) throw new Error('primary failed');
      return res.json();
    })
    .then(data => renderPage(data))
    .catch(() => {
      // Fallback to default
      return fetch(FALLBACK_URL)
        .then(res => {
          if (!res.ok) throw new Error('fallback failed');
          return res.json();
        })
        .then(data => renderPage(data))
        .catch(() => {
          // Total failure
          hide(skeleton);
          show(error);
        });
    });
})();
</script>

</body>
</html>
